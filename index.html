<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>UNICEF Activity Heatmap</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css"/>

<style>
html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  font-family: Inter, Arial, sans-serif;
  background: #0f172a;
}

#map {
  width: 100%;
  height: 100vh;
}

.control-box {
  width: 300px;
  max-height: calc(100vh - 40px);
  overflow-y: auto;
  background: rgba(255,255,255,.96);
  backdrop-filter: blur(12px);
  border-radius: 18px;
  padding: 16px;
  box-shadow: 0 10px 35px rgba(0,0,0,.22);
  border: 1px solid rgba(255,255,255,.45);
}

.control-box.hidden-panel {
  display: none;
}

.control-title {
  font-size: 20px;
  font-weight: 700;
  margin-bottom: 16px;
  color: #0f172a;
}

.lang-row {
  display: flex;
  gap: 8px;
  margin-bottom: 14px;
}

.lang-row button {
  flex: 1;
}

.control-box label {
  display: block;
  margin-top: 12px;
  margin-bottom: 6px;
  font-size: 13px;
  font-weight: 600;
  color: #334155;
}

.control-box input,
.control-box select,
.control-box button {
  width: 100%;
  box-sizing: border-box;
  border-radius: 12px;
  border: 1px solid #cbd5e1;
  padding: 10px 12px;
  font-size: 14px;
  transition: .2s;
}

.control-box input:focus,
.control-box select:focus {
  outline: none;
  border-color: #2563eb;
  box-shadow: 0 0 0 3px rgba(37,99,235,.15);
}

.control-box button {
  cursor: pointer;
  font-weight: 600;
  border: none;
}

.primary-btn {
  background: #2563eb;
  color: white;
  margin-top: 14px;
}

.primary-btn:hover {
  background: #1d4ed8;
}

.secondary-btn {
  background: #e2e8f0;
  color: #0f172a;
  margin-top: 8px;
}

.secondary-btn:hover {
  background: #cbd5e1;
}

.stats-grid {
  margin-top: 18px;
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
}

.stat-card {
  background: #f8fafc;
  border-radius: 14px;
  padding: 10px;
  border: 1px solid #e2e8f0;
}

.stat-label {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: .04em;
  color: #64748b;
}

.stat-value {
  margin-top: 5px;
  font-size: 22px;
  font-weight: 700;
  color: #0f172a;
}

.map-actions-control {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.map-action-btn {
  width: 42px;
  height: 42px;
  border-radius: 12px;
  border: none;
  background: rgba(255,255,255,.95);
  backdrop-filter: blur(10px);
  box-shadow: 0 4px 15px rgba(0,0,0,.18);
  cursor: pointer;
  font-size: 18px;
  transition: .2s;
}

.map-action-btn:hover {
  transform: translateY(-1px);
  background: white;
}

.leaflet-control-layers {
  border-radius: 14px !important;
  overflow: hidden;
  box-shadow: 0 6px 20px rgba(0,0,0,.18);
}

::-webkit-scrollbar {
  width: 8px;
}

::-webkit-scrollbar-thumb {
  background: #cbd5e1;
  border-radius: 10px;
}

::-webkit-scrollbar-track {
  background: transparent;
}
</style>
</head>

<body>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script src="https://leaflet.github.io/Leaflet.heat/dist/leaflet-heat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

<script>

const map = L.map('map').setView([49.9935, 36.2304], 8);

const osm = L.tileLayer(
'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
{
maxZoom: 19,
attribution: '&copy; OpenStreetMap'
}
).addTo(map);

const carto = L.tileLayer(
'https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',
{
maxZoom: 20,
attribution: '&copy; CARTO'
}
);

const clusterLayer = L.markerClusterGroup();

const demoData = [
{lat:49.99,lng:36.23,value:240},
{lat:48.92,lng:37.49,value:180},
{lat:49.45,lng:35.84,value:120}
];

demoData.forEach(item => {
const marker = L.marker([item.lat, item.lng]);
marker.bindPopup("People reached: " + item.value);
clusterLayer.addLayer(marker);
});

map.addLayer(clusterLayer);

const heatLayer = L.heatLayer(
demoData.map(d => [d.lat, d.lng, d.value / 240]),
{
radius: 42,
blur: 34,
maxZoom: 12,
gradient: {
0.08: "#6a00ff",
0.25: "#5b3dff",
0.45: "#3fb8ff",
0.65: "#4dff88",
0.85: "#ffe14a",
1.0: "#ff3b30"
}
}
).addTo(map);

L.control.layers(
{
"OpenStreetMap": osm,
"Carto Light": carto
},
{
"Clusters": clusterLayer,
"Heatmap": heatLayer
},
{
collapsed: false
}
).addTo(map);

const control = L.control({ position: 'topright' });

control.onAdd = function() {

const div = L.DomUtil.create('div', 'control-box');

div.innerHTML = `
<div class="lang-row">
<button>UA</button>
<button>EN</button>
</div>

<div class="control-title">
UNICEF Activity Heatmap
</div>

<label>Період від</label>
<input type="date">

<label>Період до</label>
<input type="date">

<label>Напрямок активності</label>
<select>
<option>Усі</option>
<option>Distributions</option>
<option>Emergency Team</option>
</select>

<label>Тип активності</label>
<select>
<option>Усі</option>
<option>WASH</option>
<option>Emergency</option>
</select>

<label>Тип допомоги</label>
<select>
<option>Усі</option>
<option>Emergency Hygiene Kit</option>
</select>

<label>Показник</label>
<select>
<option>Події</option>
<option>People</option>
<option>Kits</option>
</select>

<button class="primary-btn">
Застосувати фільтри
</button>

<button class="secondary-btn">
Скинути фільтри
</button>

<button class="secondary-btn">
Оновити дані
</button>

<div class="stats-grid">

<div class="stat-card">
<div class="stat-label">Events</div>
<div class="stat-value">24</div>
</div>

<div class="stat-card">
<div class="stat-label">People</div>
<div class="stat-value">1480</div>
</div>

<div class="stat-card">
<div class="stat-label">Kits</div>
<div class="stat-value">624</div>
</div>

<div class="stat-card">
<div class="stat-label">Children</div>
<div class="stat-value">312</div>
</div>

<div class="stat-card">
<div class="stat-label">Adults</div>
<div class="stat-value">1168</div>
</div>

<div class="stat-card">
<div class="stat-label">Households</div>
<div class="stat-value">208</div>
</div>

</div>
`;

L.DomEvent.disableClickPropagation(div);
L.DomEvent.disableScrollPropagation(div);

return div;
};

control.addTo(map);

const actions = L.control({ position: 'topleft' });

actions.onAdd = function() {

const div = L.DomUtil.create('div', 'map-actions-control');

div.innerHTML = `
<button id="togglePanelBtn" class="map-action-btn" title="Показати / приховати панель">☰</button>
<button id="screenshotBtn" class="map-action-btn" title="Експорт PNG">📷</button>
`;

return div;
};

actions.addTo(map);

setTimeout(() => {

document.getElementById('togglePanelBtn')
.addEventListener('click', () => {

document.querySelector('.control-box')
.classList.toggle('hidden-panel');

});

document.getElementById('screenshotBtn')
.addEventListener('click', async () => {

const canvas = await html2canvas(
document.getElementById('map'),
{
useCORS: true,
backgroundColor: null
}
);

const link = document.createElement('a');

link.download = 'unicef-activity-heatmap.png';
link.href = canvas.toDataURL('image/png');
link.click();

});

}, 100);

</script>
</body>
</html>
