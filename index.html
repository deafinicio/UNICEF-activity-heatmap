<script>
const PATHS = {
  settlements: "data/kharkiv_settlements_points.geojson",
  gromada: "data/gromada.geojson",
  activityGroups: "config/activity-groups.json",
  metrics: "config/metrics.json",
  i18nUk: "i18n/uk.json",
  i18nEn: "i18n/en.json"
};

const APPS_SCRIPT_DATA_URL =
  "https://script.google.com/macros/s/AKfycbw6ixPdp0tgPCH7dk4UYlZilgyZqHG4kwBw-e2RE3-WY8QaagZ_1uGUUVlcd5pyeSIfSg/exec";

let lang = localStorage.getItem("lang") || "uk";
let t = {};
let activityConfig = null;
let metricsConfig = null;

let settlementsGeo = null;
let coordsIndex = new Map();
let activities = [];
let filteredActivities = [];

let locationIndex = {
  raions: [],
  hromadasByRaion: {},
  settlementsByRaionHromada: {}
};
// Функція безпеки для захисту від шкідливого коду в базі даних
function escapeHTML(str) {
  if (str === null || str === undefined) return "";
  return String(str).replace(/[&<>'"]/g, function (match) {
    const escapeMap = {
      '&': '&amp;',
      '<': '&lt;',
      '>': '&gt;',
      "'": '&#39;',
      '"': '&quot;'
    };
    return escapeMap[match];
  });
}
function buildLocationIndex() {
  const raions = new Set();
  const hromadasByRaion = {};
  const settlementsByRaionHromada = {};

  // Очищаємо індекс перед заповненням
  coordsIndex.clear();

  (settlementsGeo.features || []).forEach(feature => {
    const p = feature.properties || {};
    const raion = p.raion || "";
    const hromada = p.hromada || "";
    const settlement = p.settlement || "";

    if (!raion || !hromada || !settlement) return;

    raions.add(raion);

    if (!hromadasByRaion[raion]) hromadasByRaion[raion] = new Set();
    hromadasByRaion[raion].add(hromada);

    const key = raion + "||" + hromada;
    if (!settlementsByRaionHromada[key]) settlementsByRaionHromada[key] = new Set();
    settlementsByRaionHromada[key].add(settlement);

    // Хешуємо координати населеного пункту
    const lookupKey = normalizeText(raion) + "||" + normalizeText(hromada) + "||" + normalizeText(settlement);
    coordsIndex.set(lookupKey, feature.geometry.coordinates);
  });

  locationIndex.raions = [...raions].sort((a, b) => a.localeCompare(b, "uk"));

  locationIndex.hromadasByRaion = {};
  Object.keys(hromadasByRaion).forEach(raion => {
    locationIndex.hromadasByRaion[raion] =
      [...hromadasByRaion[raion]].sort((a, b) => a.localeCompare(b, "uk"));
  });

  locationIndex.settlementsByRaionHromada = {};
  Object.keys(settlementsByRaionHromada).forEach(key => {
    locationIndex.settlementsByRaionHromada[key] =
      [...settlementsByRaionHromada[key]].sort((a, b) => a.localeCompare(b, "uk"));
  });
}
function fillSelectOptions(select, values, defaultText) {
  const previous = select.value;
  select.innerHTML = `<option value="">${defaultText}</option>`;
  values.forEach(value => {
    select.innerHTML += `<option value="${value}">${value}</option>`;
  });
  if ([...select.options].some(option => option.value === previous)) {
    select.value = previous;
  }
}

function populateLocationControls() {
  const allText = getText("filters.all", "Усі");
  fillSelectOptions(document.getElementById("raion-filter"), locationIndex.raions, allText);
  updateHromadaOptions();
  updateSettlementOptions();
}

function updateHromadaOptions() {
  const allText = getText("filters.all", "Усі");
  const selectedRaion = document.getElementById("raion-filter").value;
  const hromadaSelect = document.getElementById("hromada-filter");

  let hromadas = [];

  if (selectedRaion) {
    hromadas = locationIndex.hromadasByRaion[selectedRaion] || [];
  } else {
    const all = new Set();
    Object.values(locationIndex.hromadasByRaion).forEach(list => list.forEach(item => all.add(item)));
    hromadas = [...all].sort((a, b) => a.localeCompare(b, "uk"));
  }

  fillSelectOptions(hromadaSelect, hromadas, allText);
}

function updateSettlementOptions() {
  const allText = getText("filters.all", "Усі");
  const selectedRaion = document.getElementById("raion-filter").value;
  const selectedHromada = document.getElementById("hromada-filter").value;
  const settlementSelect = document.getElementById("settlement-filter");

  let settlements = [];

  if (selectedRaion && selectedHromada) {
    settlements = locationIndex.settlementsByRaionHromada[selectedRaion + "||" + selectedHromada] || [];
  } else {
    const all = new Set();
    Object.keys(locationIndex.settlementsByRaionHromada).forEach(key => {
      const [raion, hromada] = key.split("||");
      const okRaion = !selectedRaion || raion === selectedRaion;
      const okHromada = !selectedHromada || hromada === selectedHromada;
      if (okRaion && okHromada) {
        locationIndex.settlementsByRaionHromada[key].forEach(item => all.add(item));
      }
    });
    settlements = [...all].sort((a, b) => a.localeCompare(b, "uk"));
  }

  fillSelectOptions(settlementSelect, settlements, allText);
}



function getClusterColorClass(value) {
  if (value >= 100) return "high";
  if (value >= 10) return "mid";
  return "low";
}

function createMetricClusterIcon(cluster) {
  const markers = cluster.getAllChildMarkers();

  const sum = markers.reduce((total, marker) => {
    return total + safeNumber(marker.options.metricValue);
  }, 0);

  const label = Number.isInteger(sum) ? sum : Math.round(sum);
  const colorClass = getClusterColorClass(sum);

  return L.divIcon({
    html: `<div class="metric-cluster-bubble ${colorClass}">${label}</div>`,
    className: "metric-cluster-icon",
    iconSize: null
  });
}

let clusterLayer = L.markerClusterGroup({
  showCoverageOnHover: false,
  spiderfyOnMaxZoom: true,
  disableClusteringAtZoom: 16,
  maxClusterRadius: 55,
  iconCreateFunction: createMetricClusterIcon
});
let heatLayer = null;
let heatProxy = L.layerGroup();

const heatSettings = {
  radius: 38,
  blur: 32,
  minOpacity: 0.30,
  intensity: 1.00
};

const map = L.map("map", { zoomControl: true }).setView([49.9935, 36.2304], 8);

const kharkivBounds = L.latLngBounds([[48.5, 34.8], [50.6, 38.3]]);
map.fitBounds(kharkivBounds);

const osm = L.tileLayer(
  "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",

    crossOrigin: true,
    attribution: "&copy; OpenStreetMap"

).addTo(map);

const carto = L.tileLayer(
  "https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png",
  {
    maxZoom: 20,
    crossOrigin: true,
    attribution: "&copy; OpenStreetMap &copy; CARTO"
  }
);

const baseLayers = {
  "OpenStreetMap": osm,
  "Carto Voyager": carto
};

const overlays = {
  "Clusters": clusterLayer,
  "Heatmap": heatProxy
};


const EXTRA_METRICS = [
  {
    id: "female_total",
    field: "female_total",
    label: { uk: "Жінки / дівчата", en: "Female" }
  },

function getAllMetrics() {
  const baseMetrics = metricsConfig && Array.isArray(metricsConfig.metrics)
    ? metricsConfig.metrics
    : [];

  const excludedFields = new Set([
    "female_total",
    "male_total",
    "age_18_plus_total",
    "consultations_total"
  ]);

  const seenFields = new Set();
  const seenLabels = new Set();
  const result = [];

  baseMetrics.concat(EXTRA_METRICS).forEach(metric => {
    if (!metric || !metric.field || excludedFields.has(metric.field)) {
      return;
    }

    const label =
      metric.label && typeof metric.label === "object"
        ? (metric.label.uk || metric.label.en || metric.id)
        : getMetricLabel(metric.id);

    const normalizedLabel = normalizeValueForCompare(label);

    if (seenFields.has(metric.field) || seenLabels.has(normalizedLabel)) {
      return;
    }

    seenFields.add(metric.field);
    seenLabels.add(normalizedLabel);
    result.push(metric);
  });

  return result;
}

function getMetricConfigById(metricId) {
  return getAllMetrics().find(metric => metric.id === metricId);

function safeNumber(value) {
  if (value === null || value === undefined || value === "") return 0;

  if (typeof value === "number") {
    return Number.isFinite(value) ? value : 0;
  }

  const cleaned = String(value)
    .trim()
    .replace(/\s+/g, "")
    .replace(/,/g, ".");

  const n = Number(cleaned);
  return Number.isFinite(n) ? n : 0;
}

function cleanString(value) {
  return String(value || "").trim();
}

function normalizeText(value) {
  return String(value || "")
    .trim()
    .toLowerCase()
    .replace(/[`ʼ']/g, "’")
    .replace(/\s+/g, " ");
}

function normalizeLookupKey(value) {
  return normalizeText(value)
    .replace(/[_-]+/g, " ")
    .replace(/\s+/g, " ")
    .trim();
}

function normalizeActivityGroupValue(value) {

function normalizeActivityGroup(value) {

function normalizeDateValue(value) {
  if (!value) return "";

  if (typeof value === "string") {
    if (/^\d{4}-\d{2}-\d{2}/.test(value)) {
      return value.slice(0, 10);
    }

    const parsed = new Date(value);
    if (!isNaN(parsed.getTime())) {
      return parsed.toISOString().slice(0, 10);
    }

    return value;
  }

  const parsed = new Date(value);
  if (!isNaN(parsed.getTime())) {
    return parsed.toISOString().slice(0, 10);
  }

  return "";
}


function normalizeValueForCompare(value) {
  return String(value || "")
    .trim()
    .toLowerCase()
    .replace(/[`ʼ']/g, "’")

async function loadLiveActivities(forceRefresh = false) {
  const CACHE_KEY = "unicef_activities_cache";
  const CACHE_TIME_KEY = "unicef_activities_cache_time";
  const CACHE_TTL = 30 * 60 * 1000; // 30 хвилин

  if (!forceRefresh) {
    const cachedData = sessionStorage.getItem(CACHE_KEY);
    const cachedTime = sessionStorage.getItem(CACHE_TIME_KEY);

    if (
      cachedData &&
      cachedTime &&
      Date.now() - parseInt(cachedTime, 10) < CACHE_TTL
    ) {
      const rows = JSON.parse(cachedData);
      return Array.isArray(rows)
        ? rows.map(normalizeActivityRow)
        : [];
    }
  }

  const response = await fetch(APPS_SCRIPT_DATA_URL + "?nocache=" + Date.now());

  if (!response.ok) {
    throw new Error("Failed to load activities from Google Sheets");
  }

  const rows = await response.json();

  sessionStorage.setItem(CACHE_KEY, JSON.stringify(rows));
  sessionStorage.setItem(CACHE_TIME_KEY, Date.now().toString());

  return Array.isArray(rows)
    ? rows.map(normalizeActivityRow)
    : [];
}

function getCoordinatesForRecord(record) {
  if (record && record._coordinates) {
    return record._coordinates;
  }

  const key = [
    normalizeText(record.raion),
    normalizeText(record.hromada),
    normalizeText(record.settlement)
  ].join("||");

  return coordsIndex.get(key) || null;
}

function findSettlementPoint(record) {
  const coordinates = getCoordinatesForRecord(record);

  if (!coordinates) {
    return null;
  }

  return {
    geometry: {
      type: "Point",
      coordinates
    },
    properties: {
      raion: record.raion,
      hromada: record.hromada,
      settlement: record.settlement
    }
  };
}

function activityToFeature(record) {
  const coordinates = getCoordinatesForRecord(record);

  if (!coordinates) {
    console.warn("Settlement not found in GeoJSON:", record);
    return null;
  }

  return {
    type: "Feature",
    geometry: {
      type: "Point",
      coordinates
    },
    properties: record
  };
}

function applyFilters() {
  const selectedGroup = document.getElementById("activity-group-filter").value;
  const selectedType = document.getElementById("activity-type-filter").value;
  const selectedAssistance = document.getElementById("assistance-type-filter").value;

  const selectedRaion = document.getElementById("raion-filter").value;
  const selectedHromada = document.getElementById("hromada-filter").value;
  const selectedSettlement = document.getElementById("settlement-filter").value;

  const selectedMetricField = getCurrentMetricField();

  const dateFromValue = document.getElementById("date-from-filter").value;
  const dateToValue = document.getElementById("date-to-filter").value;

  const dateFrom = dateFromValue ? new Date(dateFromValue + "T00:00:00") : null;
  const dateTo = dateToValue ? new Date(dateToValue + "T23:59:59") : null;

  // Одноразова нормалізація обраних фільтрів
  const normSelGroup = normalizeActivityGroup(selectedGroup);
  const normSelType = normalizeValueForCompare(selectedType);
  const normSelAssistance = normalizeValueForCompare(selectedAssistance);
  const normSelRaion = normalizeValueForCompare(selectedRaion);
  const normSelHromada = normalizeValueForCompare(selectedHromada);
  const normSelSettlement = normalizeValueForCompare(selectedSettlement);

  filteredActivities = activities.filter(item => {
    const okGroup = !selectedGroup || item._normGroup === normSelGroup;
    const okType = !selectedType || item._normType === normSelType;
    const okAssistance = !selectedAssistance || item._normAssistance === normSelAssistance;

    const okRaion = !selectedRaion || item._normRaion === normSelRaion;
    const okHromada = !selectedHromada || item._normHromada === normSelHromada;
    const okSettlement = !selectedSettlement || item._normSettlement === normSelSettlement;

    let okDate = true;

    if (item.activity_date) {
      const activityDate = new Date(item.activity_date + "T12:00:00");
      if (dateFrom && activityDate < dateFrom) okDate = false;
      if (dateTo && activityDate > dateTo) okDate = false;
    }

    return okGroup && okType && okAssistance && okRaion && okHromada && okSettlement && okDate;
  });

  renderMap(filteredActivities, selectedMetricField);
  updateSummary(filteredActivities, selectedMetricField);
}

function getMarkerColor(value, maxValue) {
  if (maxValue <= 0) return "#94a3b8";

  const ratio = value / maxValue;

  if (ratio >= 0.75) return "#fb923c";
  if (ratio >= 0.40) return "#facc15";
  if (ratio >= 0.15) return "#84cc16";

  return "#86efac";
}

function createValueMarker(latlng, value, maxValue, record) {
  const color = getMarkerColor(value, maxValue);
  const label = Number.isInteger(value) ? value : Math.round(value);

  return L.marker(latlng, {
    metricValue: value,
    sourceRecord: record,
    icon: L.divIcon({
      className: "value-marker",
      html: `<div style="
        width: 34px;
        height: 34px;
        border-radius: 50%;
        background: ${color};
        color: #111827;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 800;
        font-size: 12px;
        border: 2px solid rgba(255,255,255,.85);
        box-shadow: 0 3px 10px rgba(15,23,42,.25);
      ">${label}</div>`,
      iconSize: [34, 34],
      iconAnchor: [17, 17]
    })
  });
}

function renderMap(records, metricField) {
  clusterLayer.clearLayers();

  if (heatLayer) {
    heatLayer.setLatLngs([]);
    if (!map.hasLayer(heatProxy) && map.hasLayer(heatLayer)) {
      map.removeLayer(heatLayer);
    }
  }

  const validRecords = records.filter(record => record._coordinates);

  const values = validRecords.map(record => getMetricValue(record, metricField));
  let maxValue = Math.max(...values, 1);

  const markersArray = [];
  const heatGroups = new Map();

  validRecords.forEach(record => {
    const coords = record._coordinates;
    const metricValue = getMetricValue(record, metricField);

    if (metricValue <= 0) {
      return;
    }

    const latlng = [coords[1], coords[0]];
    const marker = createValueMarker(latlng, metricValue, maxValue, record);

    const metricLabel = escapeHTML(getMetricLabel(getSelectedMetricId ? getSelectedMetricId() : ""));

    const html = `
      <b>${escapeHTML(record.settlement || "")}</b><br>
      ${escapeHTML(record.hromada || "")}, ${escapeHTML(record.raion || "")}<br>
      ${escapeHTML(getText("popup.date", "Date"))}: ${escapeHTML(record.activity_date || "—")}<br>
      ${escapeHTML(getText("popup.activityGroup", "Activity group"))}: ${escapeHTML(getActivityGroupLabel(record.activity_group))}<br>
      ${escapeHTML(getText("popup.activityType", "Activity type"))}: ${escapeHTML(record.activity_type || "—")}<br>
      ${escapeHTML(getText("popup.assistanceType", "Assistance type"))}: ${escapeHTML(record.assistance_type || "—")}<br>
      ${escapeHTML(getText("popup.people", "People"))}: ${safeNumber(record.people_total)}<br>
      ${escapeHTML(getText("popup.kits", "Kits"))}: ${safeNumber(record.kits_total)}<br>
      <b>${metricLabel}:</b> ${metricValue}
      ${record.comment ? "<br>" + escapeHTML(getText("popup.comment", "Comment")) + ": " + escapeHTML(record.comment) : ""}
    `;

    marker.bindPopup(html);
    markersArray.push(marker);

    const heatKey = coords[1] + "||" + coords[0];

    if (!heatGroups.has(heatKey)) {
      heatGroups.set(heatKey, {
        lat: coords[1],
        lon: coords[0],
        value: 0
      });
    }

    heatGroups.get(heatKey).value += metricValue;
  });

  clusterLayer.addLayers(markersArray);

  const heatPoints = [...heatGroups.values()];
  let maxHeatValue = 0;

  heatPoints.forEach(point => {
    maxHeatValue = Math.max(maxHeatValue, safeNumber(point.value));
  });

  if (maxHeatValue <= 0) {
    maxHeatValue = 1;
  }

  const heatData = heatPoints.map(point => {
    const intensity = Math.max(0.05, Math.min(1, Math.sqrt(point.value / maxHeatValue) * heatSettings.intensity));
    return [point.lat, point.lon, intensity];
  });

  if (!heatLayer) {
    heatLayer = L.heatLayer(heatData, {
      radius: heatSettings.radius,
      blur: heatSettings.blur,
      maxZoom: 12,
      minOpacity: heatSettings.minOpacity,
      gradient: {
        0.08: "#6a00ff",
        0.22: "#5b3dff",
        0.40: "#3fb8ff",
        0.60: "#4dff88",
        0.80: "#ffe14a",
        1.00: "#ff3b30"
      }
    });
  } else {
    heatLayer.setLatLngs(heatData);
  }

  if (map.hasLayer(heatProxy) && !map.hasLayer(heatLayer)) {
    heatLayer.addTo(map);
  }
}

function getDynamicActivityTypes(groupId) {
  const types = new Set();

  const matchingConfigGroups = activityConfig.activity_groups.filter(group => {
    if (!groupId) return true;
    return normalizeActivityGroupValue(group.id) === normalizeActivityGroupValue(groupId);
  });

  matchingConfigGroups.forEach(group => {
    (group.activity_types || []).forEach(type => {
      if (type) types.add(type);
    });
  });

  activities.forEach(item => {
    const itemGroup = normalizeActivityGroupValue(item.activity_group);

    if (!groupId || itemGroup === normalizeActivityGroupValue(groupId)) {
      if (item.activity_type) {
        types.add(item.activity_type);
      }
    }
  });

  return [...types].sort((a, b) => a.localeCompare(b, "en"));
}

function updateActivityTypeOptions(preferredValue = "") {

  const typeSelect = document.getElementById("activity-type-filter");

  const currentValue = preferredValue || typeSelect.value;

  typeSelect.innerHTML = `<option value="">${getText("filters.all", "All")}</option>`;

  const types = getDynamicActivityTypes(groupId);

  types.forEach(type => {
    typeSelect.innerHTML += `<option value="${type}">${type}</option>`;
  });

  if ([...typeSelect.options].some(option => option.value === currentValue)) {
    typeSelect.value = currentValue;
  }
}

async function loadI18n() {
  const url = lang === "uk" ? PATHS.i18nUk : PATHS.i18nEn;
  t = await fetch(url).then(r => r.json());
}

async function refreshLiveData() {
  sessionStorage.removeItem("unicef_activities_cache");
  sessionStorage.removeItem("unicef_activities_cache_time");

  activities = await loadLiveActivities(true);
  filteredActivities = activities;
  applyFilters();
}

async function switchLanguage(newLang) {
  if (lang === newLang) {
    updateLanguageButtons();
    return;
  }

  lang = newLang;
  localStorage.setItem("lang", lang);

  await loadI18n();

  translateStaticUI();
  populateControls();
  populateLocationControls();
  updateActivityTypeOptions();
  applyFilters();
}

// ── Loading overlay helpers ──────────────────────────────────────────
function setLoadingMessage(msg, stepDone) {
  const el = document.getElementById("loading-message");
  if (el) el.textContent = msg;
  if (stepDone !== undefined) {
    for (let i = 1; i <= 3; i++) {
      const s = document.getElementById("step-" + i);
      if (!s) continue;
      s.className = "loading-step" + (i < stepDone ? " done" : i === stepDone ? " active" : "");
    }
  }
}

function hideLoadingOverlay() {
  const overlay = document.getElementById("loading-overlay");
  if (!overlay) return;
  overlay.classList.add("fade-out");
  setTimeout(() => overlay.classList.add("hidden"), 500);
}

async function init() {
  // Крок 1: мова + геодані + конфіги — паралельно
  setLoadingMessage(lang === "uk" ? "Завантаження мови та геоданих…" : "Loading language and geo data…", 1);

  const [, settlements, groups, metrics] = await Promise.all([
    loadI18n(),
    fetch(PATHS.settlements).then(r => {
      if (!r.ok) throw new Error("Не вдалося завантажити settlements.geojson");
      return r.json();
    }),
    fetch(PATHS.activityGroups).then(r => {
      if (!r.ok) throw new Error("Не вдалося завантажити activity-groups.json");
      return r.json();
    }),
    fetch(PATHS.metrics).then(r => {
      if (!r.ok) throw new Error("Не вдалося завантажити metrics.json");
      return r.json();
    })
  ]);

  settlementsGeo = settlements;
  activityConfig = groups;
  metricsConfig = metrics;

  buildLocationIndex();
  translateStaticUI();
  populateControls();
  populateLocationControls();

  // Крок 2: живі дані з Google Sheets
  setLoadingMessage(lang === "uk" ? "Завантаження активностей з Google Sheets…" : "Loading activities from Google Sheets…", 2);

  activities = await loadLiveActivities();
  filteredActivities = activities;

  // Крок 3: рендер карти
  setLoadingMessage(lang === "uk" ? "Побудова карти…" : "Building map…", 3);
  applyFilters();

  hideLoadingOverlay();

  // Lazy-load границь громад у фоні — не блокує рендер
  if (PATHS.gromada) {
    fetch(PATHS.gromada)
      .then(r => r.ok ? r.json() : null)
      .then(geojson => {
        if (!geojson) return;
        L.geoJSON(geojson, {
          style: {
            color: "#3b82f6",
            weight: 1.2,
            opacity: 0.55,
            fillOpacity: 0
          },
          interactive: false
        }).addTo(map);
      })
      .catch(() => { /* не критично */ });
  }
}

  }
}

function updateHeatSettingsFromControls() {
  const radiusControl = document.getElementById("heat-radius-control");
  const blurControl = document.getElementById("heat-blur-control");
  const opacityControl = document.getElementById("heat-opacity-control");
  const intensityControl = document.getElementById("heat-intensity-control");

  if (!radiusControl || !blurControl || !opacityControl || !intensityControl) {
    return;
  }

  heatSettings.radius = Number(radiusControl.value);
  heatSettings.blur = Number(blurControl.value);
  heatSettings.minOpacity = Number(opacityControl.value);
  heatSettings.intensity = Number(intensityControl.value);

  document.getElementById("heat-radius-value").textContent = heatSettings.radius;
  document.getElementById("heat-blur-value").textContent = heatSettings.blur;
  document.getElementById("heat-opacity-value").textContent = heatSettings.minOpacity.toFixed(2);
  document.getElementById("heat-intensity-value").textContent = heatSettings.intensity.toFixed(2);

  if (heatLayer) {
    heatLayer.setOptions({
      radius: heatSettings.radius,
      blur: heatSettings.blur,
      minOpacity: heatSettings.minOpacity
    });
  }

  renderMap(filteredActivities, getCurrentMetricField());
}

async function exportMapToPng() {
  const button = document.getElementById("export-png-btn");
  button.disabled = true;
  button.textContent = "…";

  try {
    const canvas = await html2canvas(document.getElementById("map"), {
      useCORS: true,
      allowTaint: false,
      backgroundColor: null,
      logging: false
    });

    const link = document.createElement("a");
    const timestamp = new Date().toISOString().replace(/[:.]/g, "-");

    link.download = `unicef-activity-heatmap-${timestamp}.png`;
    link.href = canvas.toDataURL("image/png");
    link.click();
  } catch (error) {
    console.error(error);
    alert(
      lang === "uk"
        ? "Не вдалося створити PNG. Спробуй ще раз або перевір консоль."
        : "Failed to export PNG. Try again or check console."
    );
  } finally {
    button.disabled = false;
    button.textContent = "📷";
  }
}

// Делегування подій на document — надійно працює з Leaflet-контролами,
// які будують HTML динамічно і можуть з'явитись в DOM пізніше ніж setTimeout.

document.addEventListener("change", (e) => {
  const id = e.target.id;
  if      (id === "activity-group-filter")  { updateActivityTypeOptions(); applyFilters(); }
  else if (id === "activity-type-filter")   applyFilters();
  else if (id === "assistance-type-filter") applyFilters();
  else if (id === "metric-filter")          applyFilters();
  else if (id === "raion-filter")    { updateHromadaOptions(); updateSettlementOptions(); applyFilters(); }
  else if (id === "hromada-filter")  { updateSettlementOptions(); applyFilters(); }
  else if (id === "settlement-filter")      applyFilters();
  else if (id === "date-from-filter")       applyFilters();
  else if (id === "date-to-filter")         applyFilters();
});

document.addEventListener("input", (e) => {
  if (["heat-radius-control","heat-blur-control","heat-opacity-control","heat-intensity-control"].includes(e.target.id))
    updateHeatSettingsFromControls();
});

document.addEventListener("click", (e) => {
  const id = e.target.id;

  if (id === "apply-filters") {
    applyFilters();

  } else if (id === "toggle-filters-btn") {
    document.querySelector(".control-box").classList.toggle("hidden-panel");

  } else if (id === "export-png-btn") {
    exportMapToPng();

  } else if (id === "toggle-map-settings-btn") {
    const layersControl = document.querySelector(".leaflet-control-layers");
    const heatSettingsBox = document.getElementById("heat-settings-box");
    if (layersControl) layersControl.classList.toggle("hidden-map-settings");
    if (heatSettingsBox) heatSettingsBox.classList.toggle("hidden-heat-settings");


  } else if (id === "reset-filters") {
    document.getElementById("date-from-filter").value = "";
    document.getElementById("date-to-filter").value = "";
    document.getElementById("activity-group-filter").value = "";
    updateActivityTypeOptions();
    document.getElementById("activity-type-filter").value = "";
    document.getElementById("assistance-type-filter").value = "";
    document.getElementById("metric-filter").value =
      metricsConfig ? metricsConfig.default_metric : "event_count";
    document.getElementById("raion-filter").value = "";
    updateHromadaOptions();
    document.getElementById("hromada-filter").value = "";
    updateSettlementOptions();
    document.getElementById("settlement-filter").value = "";
    applyFilters();
  }
});

setTimeout(() => {
  updateLanguageButtons();
}, 0);

init().catch(error => {
  console.error(error);
  const overlay = document.getElementById("loading-overlay");
  if (overlay) {
    const spinner = overlay.querySelector(".loading-spinner");
    if (spinner) spinner.style.display = "none";
    const msg = document.getElementById("loading-message");
    if (msg) {
      msg.style.color = "#f87171";
      msg.style.maxWidth = "280px";
      msg.innerHTML = `⚠️ Помилка завантаження:<br><small>${error.message}</small><br><br><small style="opacity:.6">Перевірте з'єднання та оновіть сторінку (F5)</small>`;
    }
  } else {
    document.getElementById("stats-bottom-bar").innerHTML =
      `<b>Помилка завантаження</b><br>${error.message}`;
  }
});
