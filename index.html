<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />

<title>UNICEF Activity Heatmap — Kharkiv Oblast</title>
<meta name="description" content="Interactive activity heatmap for UNICEF-supported activities in Kharkiv Oblast." />

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />

<style>
  html, body {
    height: 100%;
    margin: 0;
    font-family: Inter, Arial, sans-serif;
  }

  #map {
    height: 100vh;
  }

  .control-box {
    width: 250px;
    max-height: calc(100vh - 22px);
    overflow: visible;
    background: rgba(255, 255, 255, 0.96);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(226, 232, 240, 0.95);
    border-radius: 14px;
    box-shadow: 0 8px 28px rgba(15, 23, 42, 0.18);
    padding: 10px;
    color: #0f172a;
  }

  .control-box.hidden-panel {
    display: none;
  }

  .control-title {
    font-size: 15px;
    font-weight: 800;
    margin: 4px 0 8px;
    line-height: 1.15;
  }

  .lang-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
    margin-bottom: 8px;
  }

  .control-box label {
    display: block;
    margin-top: 7px;
    margin-bottom: 3px;
    font-size: 11px;
    font-weight: 700;
    color: #334155;
  }

  .control-box input,
  .control-box select,
  .control-box button {
    width: 100%;
    box-sizing: border-box;
    border-radius: 8px;
    border: 1px solid #cbd5e1;
    padding: 5px 7px;
    font-size: 12px;
    line-height: 1.2;
    background: #fff;
  }

  .control-box input,
  .control-box select {
    height: 29px;
  }

  .control-box button {
    cursor: pointer;
    font-weight: 700;
  }

  .control-box input:focus,
  .control-box select:focus {
    outline: none;
    border-color: #2563eb;
    box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.13);
  }

  .lang-row button {
    height: 30px;
    background: #f8fafc;
    color: #0f172a;
  }

  .lang-row button.active-lang {
    background: #2563eb;
    color: #ffffff;
    border-color: #2563eb;
  }

  .lang-row button:hover,
  .secondary-btn:hover {
    background: #e2e8f0;
  }

  .lang-row button.active-lang:hover {
    background: #1d4ed8;
  }

  .primary-btn {
    height: 30px;
    margin-top: 9px;
    background: #2563eb !important;
    color: white;
    border: 0 !important;
  }

  .primary-btn:hover {
    background: #1d4ed8 !important;
  }

  .secondary-btn {
    height: 28px;
    margin-top: 5px;
    background: #f1f5f9 !important;
    color: #0f172a;
  }

  .stats-grid {
    margin-top: 9px;
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 6px;
  }

  .stat-card {
    background: #f8fafc;
    border: 1px solid #e2e8f0;
    border-radius: 10px;
    padding: 6px 7px;
    min-width: 0;
  }

  .stat-label {
    font-size: 9px;
    line-height: 1;
    text-transform: uppercase;
    letter-spacing: .03em;
    color: #64748b;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .stat-value {
    margin-top: 3px;
    font-size: 15px;
    line-height: 1.05;
    font-weight: 800;
    color: #0f172a;
  }

  .stat-card.wide {
    grid-column: span 2;
  }

  .leaflet-control.map-actions-control {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    margin-top: 72px;
    margin-left: 10px;
  }

  .map-action-btn {
    width: 38px;
    height: 38px;
    border-radius: 10px;
    border: 1px solid rgba(203, 213, 225, .9);
    background: rgba(255,255,255,.96);
    box-shadow: 0 5px 16px rgba(15,23,42,.20);
    cursor: pointer;
    font-size: 17px;
    line-height: 1;
    display: block;
    margin-bottom: 6px;
  }

  .map-action-btn:hover {
    background: #ffffff;
    transform: translateY(-1px);
  }

  .map-action-btn:disabled {
    opacity: 0.6;
    cursor: not-allowed;
  }

  .leaflet-control-layers {
    border-radius: 12px !important;
    overflow: hidden;
    box-shadow: 0 6px 20px rgba(15,23,42,.18);
    font-size: 12px;
  }


  .leaflet-bottom.leaflet-left .leaflet-control-layers {
    max-width: calc(100vw - 24px);
    padding: 7px 10px;
    border-radius: 14px !important;
    background: rgba(255,255,255,.96);
    backdrop-filter: blur(10px);
    box-shadow: 0 6px 20px rgba(15,23,42,.18);
    font-size: 12px;
  }

  .leaflet-bottom.leaflet-left .leaflet-control-layers form {
    display: flex;
    flex-direction: row;
    flex-wrap: nowrap;
    gap: 10px;
    align-items: center;
    overflow-x: auto;
    white-space: nowrap;
  }
  .leaflet-bottom.leaflet-left .leaflet-control-layers-base,
  .leaflet-bottom.leaflet-left .leaflet-control-layers-overlays {
    display: flex;
    flex-direction: row;
    gap: 10px;
    align-items: center;
  }


  .leaflet-bottom.leaflet-left .leaflet-control-layers label {
    margin: 0;
    white-space: nowrap;
  }

  .leaflet-bottom.leaflet-left .leaflet-control-layers-separator {
    display: none;
  }

  @media (max-height: 760px) {
    .control-box {
      width: 235px;
      padding: 8px;
    }

    .control-title {
      font-size: 14px;
      margin-bottom: 6px;
    }

    .control-box label {
      margin-top: 5px;
      font-size: 10px;
    }

    .control-box input,
    .control-box select,
    .control-box button {
      padding: 4px 6px;
      font-size: 11px;
    }

    .control-box input,
    .control-box select {
      height: 26px;
    }

    .stats-grid {
      gap: 5px;
    }

    .stat-card {
      padding: 5px 6px;
    }

    .stat-value {
      font-size: 13px;
    }
  }
</style>
</head>

<body>
<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script src="https://leaflet.github.io/Leaflet.heat/dist/leaflet-heat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

<script>
const PATHS = {
  settlements: "data/kharkiv_settlements_points.geojson",
  activityGroups: "config/activity-groups.json",
  metrics: "config/metrics.json",
  i18nUk: "i18n/uk.json",
  i18nEn: "i18n/en.json"
};

const APPS_SCRIPT_DATA_URL =
  "https://script.google.com/macros/s/AKfycbw6ixPdp0tgPCH7dk4UYlZilgyZqHG4kwBw-e2RE3-WY8QaagZ_1uGUUVlcd5pyeSIfSg/exec";

let lang = localStorage.getItem("lang") || "uk";
let t = {};
let activityConfig = null;
let metricsConfig = null;

let settlementsGeo = null;
let activities = [];
let filteredActivities = [];

let clusterLayer = L.markerClusterGroup();
let heatLayer = null;
let heatProxy = L.layerGroup();

const map = L.map("map", { zoomControl: true }).setView([49.9935, 36.2304], 8);

const kharkivBounds = L.latLngBounds([[48.5, 34.8], [50.6, 38.3]]);
map.fitBounds(kharkivBounds);

const osm = L.tileLayer(
  "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
  {
    maxZoom: 19,
    crossOrigin: true,
    attribution: "&copy; OpenStreetMap"
  }
).addTo(map);

const carto = L.tileLayer(
  "https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png",
  {
    maxZoom: 20,
    crossOrigin: true,
    attribution: "&copy; OpenStreetMap &copy; CARTO"
  }
);

const baseLayers = {
  "OpenStreetMap": osm,
  "Carto Voyager": carto
};

const overlays = {
  "Clusters": clusterLayer,
  "Heatmap": heatProxy
};


const EXTRA_METRICS = [
  {
    id: "female_total",
    field: "female_total",
    label: { uk: "Жінки / дівчата", en: "Female" }
  },
  {
    id: "male_total",
    field: "male_total",
    label: { uk: "Чоловіки / хлопці", en: "Male" }
  },
  {
    id: "children_total",
    field: "children_total",
    label: { uk: "Діти 0–17", en: "Children 0–17" }
  },
  {
    id: "adults_total",
    field: "adults_total",
    label: { uk: "Дорослі 18+", en: "Adults 18+" }
  },
  {
    id: "female_0_4",
    field: "female_0_4",
    label: { uk: "Дівчата 0–4", en: "Female 0–4" }
  },
  {
    id: "male_0_4",
    field: "male_0_4",
    label: { uk: "Хлопці 0–4", en: "Male 0–4" }
  },
  {
    id: "female_5_9",
    field: "female_5_9",
    label: { uk: "Дівчата 5–9", en: "Female 5–9" }
  },
  {
    id: "male_5_9",
    field: "male_5_9",
    label: { uk: "Хлопці 5–9", en: "Male 5–9" }
  },
  {
    id: "female_10_14",
    field: "female_10_14",
    label: { uk: "Дівчата 10–14", en: "Female 10–14" }
  },
  {
    id: "male_10_14",
    field: "male_10_14",
    label: { uk: "Хлопці 10–14", en: "Male 10–14" }
  },
  {
    id: "female_15_17",
    field: "female_15_17",
    label: { uk: "Дівчата 15–17", en: "Female 15–17" }
  },
  {
    id: "male_15_17",
    field: "male_15_17",
    label: { uk: "Хлопці 15–17", en: "Male 15–17" }
  },
  {
    id: "female_18_plus",
    field: "female_18_plus",
    label: { uk: "Жінки 18+", en: "Female 18+" }
  },
  {
    id: "male_18_plus",
    field: "male_18_plus",
    label: { uk: "Чоловіки 18+", en: "Male 18+" }
  },
  {
    id: "age_0_4_total",
    field: "age_0_4_total",
    label: { uk: "Усі 0–4", en: "All 0–4" }
  },
  {
    id: "age_5_9_total",
    field: "age_5_9_total",
    label: { uk: "Усі 5–9", en: "All 5–9" }
  },
  {
    id: "age_10_14_total",
    field: "age_10_14_total",
    label: { uk: "Усі 10–14", en: "All 10–14" }
  },
  {
    id: "age_15_17_total",
    field: "age_15_17_total",
    label: { uk: "Усі 15–17", en: "All 15–17" }
  },
  {
    id: "age_18_plus_total",
    field: "age_18_plus_total",
    label: { uk: "Усі 18+", en: "All 18+" }
  }
];

function getAllMetrics() {
  const baseMetrics = metricsConfig && Array.isArray(metricsConfig.metrics)
    ? metricsConfig.metrics
    : [];

  return baseMetrics.concat(EXTRA_METRICS);
}

function getMetricConfigById(metricId) {
  return getAllMetrics().find(metric => metric.id === metricId);
}


L.control.layers(baseLayers, overlays, { collapsed: false, position: "bottomleft" }).addTo(map);

map.addLayer(clusterLayer);
map.addLayer(heatProxy);

heatProxy.on("add", function() {
  if (heatLayer && !map.hasLayer(heatLayer)) {
    heatLayer.addTo(map);
  }
});

heatProxy.on("remove", function() {
  if (heatLayer && map.hasLayer(heatLayer)) {
    map.removeLayer(heatLayer);
  }
});

function safeNumber(value) {
  if (value === null || value === undefined || value === "") return 0;

  if (typeof value === "number") {
    return Number.isFinite(value) ? value : 0;
  }

  const cleaned = String(value)
    .trim()
    .replace(/\s+/g, "")
    .replace(/,/g, ".");

  const n = Number(cleaned);
  return Number.isFinite(n) ? n : 0;
}

function cleanString(value) {
  return String(value || "").trim();
}

function normalizeText(value) {
  return String(value || "")
    .trim()
    .toLowerCase()
    .replace(/[`ʼ']/g, "’")
    .replace(/\s+/g, " ");
}

function normalizeLookupKey(value) {
  return normalizeText(value)
    .replace(/[_-]+/g, " ")
    .replace(/\s+/g, " ")
    .trim();
}

function normalizeActivityGroupValue(value) {
  const key = normalizeLookupKey(value);

  const aliases = {
    "distributions": "distributions",
    "distribution": "distributions",
    "дистрибуції": "distributions",
    "дистрибуція": "distributions",

    "emergency team": "emergency_team",
    "emergency_team": "emergency_team",

    "mobile medical teams": "mobile_medical_teams",
    "mobile medical team": "mobile_medical_teams",
    "mobile_medical_teams": "mobile_medical_teams",
    "мобільні медичні команди": "mobile_medical_teams",
    "мобільна медична команда": "mobile_medical_teams",

    "cash assistance": "cash_assistance",
    "cash_assistance": "cash_assistance",
    "грошова допомога": "cash_assistance",

    "training sessions": "training_sessions",
    "training session": "training_sessions",
    "training_sessions": "training_sessions",
    "навчальні сесії": "training_sessions",
    "навчальна сесія": "training_sessions",

    "repair": "repair",
    "ремонт": "repair"
  };

  return aliases[key] || cleanString(value);
}

function normalizeDateValue(value) {
  if (!value) return "";

  if (typeof value === "string") {
    if (/^\d{4}-\d{2}-\d{2}/.test(value)) {
      return value.slice(0, 10);
    }

    const parsed = new Date(value);
    if (!isNaN(parsed.getTime())) {
      return parsed.toISOString().slice(0, 10);
    }

    return value;
  }

  const parsed = new Date(value);
  if (!isNaN(parsed.getTime())) {
    return parsed.toISOString().slice(0, 10);
  }

  return "";
}

function getText(path, fallback = "") {
  return path.split(".").reduce((obj, key) => obj && obj[key], t) || fallback;
}

function getMetricValue(record, metricField) {
  return safeNumber(record[metricField]);
}

function getActivityGroupLabel(id) {
  return getText("activityGroups." + id, id);
}

function getMetricLabel(id) {
  const extraMetric = EXTRA_METRICS.find(metric => metric.id === id);

  if (extraMetric) {
    return extraMetric.label[lang] || extraMetric.label.en || id;
  }

  return getText("metrics." + id, id);
}

function getBilingualLabel(key, ukFallback, enFallback) {
  return lang === "uk"
    ? getText(key, ukFallback)
    : getText(key, enFallback);
}

async function loadLiveActivities() {
  const response = await fetch(APPS_SCRIPT_DATA_URL + "?nocache=" + Date.now());

  if (!response.ok) {
    throw new Error("Failed to load activities from Google Sheets");
  }

  const rows = await response.json();

  return Array.isArray(rows)
    ? rows.map(normalizeActivityRow)
    : [];
}

function normalizeActivityRow(row) {
  return {
    created_at: row.created_at || "",
    activity_group: normalizeActivityGroupValue(row.activity_group),
    activity_type: cleanString(row.activity_type),
    assistance_type: cleanString(row.assistance_type),
    activity_date: normalizeDateValue(row.activity_date),
    raion: cleanString(row.raion),
    hromada: cleanString(row.hromada),
    settlement: cleanString(row.settlement),
    location_raw: cleanString(row.location_raw),
    comment: cleanString(row.comment),
    event_count: safeNumber(row.event_count) || 1,
    people_total: safeNumber(row.people_total),
    children_total: safeNumber(row.children_total),
    adults_total: safeNumber(row.adults_total),
    kits_total: safeNumber(row.kits_total),
    households_total: safeNumber(row.households_total),
    consultations_total: safeNumber(row.consultations_total),
    objects_repaired: safeNumber(row.objects_repaired),
    female_0_4: safeNumber(row.female_0_4),
    male_0_4: safeNumber(row.male_0_4),
    female_5_9: safeNumber(row.female_5_9),
    male_5_9: safeNumber(row.male_5_9),
    female_10_14: safeNumber(row.female_10_14),
    male_10_14: safeNumber(row.male_10_14),
    female_15_17: safeNumber(row.female_15_17),
    male_15_17: safeNumber(row.male_15_17),
    female_18_plus: safeNumber(row.female_18_plus),
    male_18_plus: safeNumber(row.male_18_plus),
    female_total: safeNumber(row.female_total),
    male_total: safeNumber(row.male_total),
    age_0_4_total: safeNumber(row.age_0_4_total),
    age_5_9_total: safeNumber(row.age_5_9_total),
    age_10_14_total: safeNumber(row.age_10_14_total),
    age_15_17_total: safeNumber(row.age_15_17_total),
    age_18_plus_total: safeNumber(row.age_18_plus_total)
  };
}

function findSettlementPoint(record) {
  const features = settlementsGeo.features || [];

  const raion = normalizeText(record.raion);
  const hromada = normalizeText(record.hromada);
  const settlement = normalizeText(record.settlement);

  return features.find(f => {
    const p = f.properties || {};
    return normalizeText(p.raion) === raion &&
      normalizeText(p.hromada) === hromada &&
      normalizeText(p.settlement) === settlement;
  });
}

function activityToFeature(record) {
  const point = findSettlementPoint(record);
  if (!point || !point.geometry || !point.geometry.coordinates) {
    console.warn("Settlement not found in GeoJSON:", record);
    return null;
  }

  return {
    type: "Feature",
    geometry: {
      type: "Point",
      coordinates: point.geometry.coordinates
    },
    properties: record
  };
}

function getCurrentMetricField() {
  const metricId = document.getElementById("metric-filter")?.value ||
    metricsConfig.default_metric;

  const metric = getMetricConfigById(metricId);
  return metric ? metric.field : "event_count";
}

function applyFilters() {
  const group = document.getElementById("activity-group-filter").value;
  const type = document.getElementById("activity-type-filter").value;
  const assistance = document.getElementById("assistance-type-filter").value;
  const metricField = getCurrentMetricField();

  const dateFromValue = document.getElementById("date-from-filter").value;
  const dateToValue = document.getElementById("date-to-filter").value;

  const dateFrom = dateFromValue ? new Date(dateFromValue + "T00:00:00") : null;
  const dateTo = dateToValue ? new Date(dateToValue + "T23:59:59") : null;

  filteredActivities = activities.filter(item => {
    const okGroup = !group || item.activity_group === group;
    const okType = !type || item.activity_type === type;
    const okAssistance = !assistance || item.assistance_type === assistance;

    let okDate = true;

    if (item.activity_date) {
      const activityDate = new Date(item.activity_date + "T12:00:00");

      if (dateFrom && activityDate < dateFrom) okDate = false;
      if (dateTo && activityDate > dateTo) okDate = false;
    }

    return okGroup && okType && okAssistance && okDate;
  });

  renderMap(filteredActivities, metricField);
  updateSummary(filteredActivities, metricField);
}

function renderMap(records, metricField) {
  clusterLayer.clearLayers();

  if (heatLayer) {
    heatLayer.setLatLngs([]);

    if (!map.hasLayer(heatProxy) && map.hasLayer(heatLayer)) {
      map.removeLayer(heatLayer);
    }
  }

  const features = records.map(activityToFeature).filter(Boolean);

  const geo = {
    type: "FeatureCollection",
    features
  };

  const markers = L.geoJSON(geo, {
    pointToLayer: function(feature, latlng) {
      return L.marker(latlng);
    },
    onEachFeature: function(feature, layer) {
      const p = feature.properties || {};
      const metricValue = getMetricValue(p, metricField);

      const html = `
        <b>${p.settlement || ""}</b><br>
        ${p.hromada || ""}, ${p.raion || ""}<br>
        ${getText("popup.date", "Date")}: ${p.activity_date || "—"}<br>
        ${getText("popup.activityGroup", "Activity group")}: ${getActivityGroupLabel(p.activity_group)}<br>
        ${getText("popup.activityType", "Activity type")}: ${p.activity_type || "—"}<br>
        ${getText("popup.assistanceType", "Assistance type")}: ${p.assistance_type || "—"}<br>
        ${getText("popup.people", "People")}: ${safeNumber(p.people_total)}<br>
        ${getText("popup.kits", "Kits")}: ${safeNumber(p.kits_total)}<br>
        <b>${getText("filters.metric", "Metric")}:</b> ${metricValue}
        ${p.comment ? "<br>" + getText("popup.comment", "Comment") + ": " + p.comment : ""}
      `;

      layer.bindPopup(html);
    }
  });

  clusterLayer.addLayer(markers);

  let maxValue = 0;
  features.forEach(feature => {
    maxValue = Math.max(maxValue, getMetricValue(feature.properties, metricField));
  });

  if (maxValue <= 0) maxValue = 1;

  const heatData = features.map(feature => {
    const coords = feature.geometry.coordinates;
    const value = getMetricValue(feature.properties, metricField);
    const intensity = Math.max(0.15, Math.min(1, Math.sqrt(value / maxValue)));

    return [coords[1], coords[0], intensity];
  });

  if (!heatLayer) {
    heatLayer = L.heatLayer(heatData, {
      radius: 38,
      blur: 32,
      maxZoom: 12,
      minOpacity: 0.30,
      gradient: {
        0.08: "#6a00ff",
        0.22: "#5b3dff",
        0.40: "#3fb8ff",
        0.60: "#4dff88",
        0.80: "#ffe14a",
        1.00: "#ff3b30"
      }
    });
  } else {
    heatLayer.setLatLngs(heatData);
  }

  if (map.hasLayer(heatProxy) && !map.hasLayer(heatLayer)) {
    heatLayer.addTo(map);
  }
}

function updateSummary(records, metricField) {
  const totalEvents = records.length;

  const totalPeople = records.reduce((sum, item) =>
    sum + safeNumber(item.people_total), 0);

  const totalKits = records.reduce((sum, item) =>
    sum + safeNumber(item.kits_total), 0);

  const totalChildren = records.reduce((sum, item) =>
    sum + safeNumber(item.children_total), 0);

  const totalAdults = records.reduce((sum, item) =>
    sum + safeNumber(item.adults_total), 0);

  const totalHouseholds = records.reduce((sum, item) =>
    sum + safeNumber(item.households_total), 0);

  const totalConsultations = records.reduce((sum, item) =>
    sum + safeNumber(item.consultations_total), 0);

  const totalMetric = records.reduce((sum, item) =>
    sum + getMetricValue(item, metricField), 0);

  document.getElementById("summary-box").innerHTML = `
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-label">${getBilingualLabel("summary.events", "Події", "Events")}</div>
        <div class="stat-value">${totalEvents}</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">${getBilingualLabel("summary.people", "Люди", "People")}</div>
        <div class="stat-value">${totalPeople}</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">${getBilingualLabel("summary.kits", "Набори", "Kits")}</div>
        <div class="stat-value">${totalKits}</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">${getBilingualLabel("summary.children", "Діти", "Children")}</div>
        <div class="stat-value">${totalChildren}</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">${getBilingualLabel("summary.adults", "Дорослі", "Adults")}</div>
        <div class="stat-value">${totalAdults}</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">${getBilingualLabel("summary.households", "Домогосп.", "HH")}</div>
        <div class="stat-value">${totalHouseholds}</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">${getBilingualLabel("summary.consultations", "Консульт.", "Consult.")}</div>
        <div class="stat-value">${totalConsultations}</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">${getBilingualLabel("summary.currentMetric", "Показник", "Metric")}</div>
        <div class="stat-value">${totalMetric}</div>
      </div>
      <div class="stat-card wide">
        <div class="stat-label">${getBilingualLabel("summary.visibleRecords", "Видимі записи", "Visible records")}</div>
        <div class="stat-value">${records.length}</div>
      </div>
    </div>
  `;
}

function populateControls() {
  const groupSelect = document.getElementById("activity-group-filter");
  const typeSelect = document.getElementById("activity-type-filter");
  const assistanceSelect = document.getElementById("assistance-type-filter");
  const metricSelect = document.getElementById("metric-filter");

  const selectedGroup = groupSelect.value;
  const selectedType = typeSelect.value;
  const selectedAssistance = assistanceSelect.value;
  const selectedMetric = metricSelect.value;

  groupSelect.innerHTML = `<option value="">${getText("filters.all", "All")}</option>`;
  activityConfig.activity_groups.forEach(group => {
    groupSelect.innerHTML += `<option value="${group.id}">${getActivityGroupLabel(group.id)}</option>`;
  });

  if ([...groupSelect.options].some(option => option.value === selectedGroup)) {
    groupSelect.value = selectedGroup;
  }

  updateActivityTypeOptions(selectedType);

  assistanceSelect.innerHTML = `<option value="">${getText("filters.all", "All")}</option>`;
  activityConfig.assistance_types.forEach(type => {
    assistanceSelect.innerHTML += `<option value="${type}">${type}</option>`;
  });

  if ([...assistanceSelect.options].some(option => option.value === selectedAssistance)) {
    assistanceSelect.value = selectedAssistance;
  }

  metricSelect.innerHTML = "";
  getAllMetrics().forEach(metric => {
    metricSelect.innerHTML += `<option value="${metric.id}">${getMetricLabel(metric.id)}</option>`;
  });

  metricSelect.value =
    [...metricSelect.options].some(option => option.value === selectedMetric)
      ? selectedMetric
      : metricsConfig.default_metric;
}

function updateActivityTypeOptions(preferredValue = "") {
  const groupId = document.getElementById("activity-group-filter").value;
  const typeSelect = document.getElementById("activity-type-filter");

  const currentValue = preferredValue || typeSelect.value;

  typeSelect.innerHTML = `<option value="">${getText("filters.all", "All")}</option>`;

  const group = activityConfig.activity_groups.find(g => g.id === groupId);

  const types = group
    ? group.activity_types
    : activityConfig.activity_groups.flatMap(g => g.activity_types || []);

  [...new Set(types)].forEach(type => {
    typeSelect.innerHTML += `<option value="${type}">${type}</option>`;
  });

  if ([...typeSelect.options].some(option => option.value === currentValue)) {
    typeSelect.value = currentValue;
  }
}

function updateLanguageButtons() {
  const ukButton = document.getElementById("lang-uk");
  const enButton = document.getElementById("lang-en");

  if (!ukButton || !enButton) return;

  ukButton.classList.toggle("active-lang", lang === "uk");
  enButton.classList.toggle("active-lang", lang === "en");
}

function translateStaticUI() {
  document.documentElement.lang = lang;

  document.getElementById("control-title").textContent =
    getText("app.title", "UNICEF Activity Heatmap");

  document.getElementById("label-date-from").textContent =
    getText("filters.dateFrom", "Date from");

  document.getElementById("label-date-to").textContent =
    getText("filters.dateTo", "Date to");

  document.getElementById("label-activity-group").textContent =
    getText("filters.activityGroup", "Activity group");

  document.getElementById("label-activity-type").textContent =
    getText("filters.activityType", "Activity type");

  document.getElementById("label-assistance-type").textContent =
    getText("filters.assistanceType", "Assistance type");

  document.getElementById("label-metric").textContent =
    getText("filters.metric", "Metric");

  document.getElementById("apply-filters").textContent =
    getText("buttons.applyFilters", "Apply filters");

  document.getElementById("reset-filters").textContent =
    getText("buttons.resetFilters", "Reset filters");

  document.getElementById("refresh-data").textContent =
    getText("buttons.refreshData", "Refresh data");

  document.getElementById("toggle-filters-btn").title =
    getText("buttons.showHideFilters", "Show / hide filters");

  document.getElementById("export-png-btn").title =
    getText("buttons.exportPng", "Export PNG");

  updateLanguageButtons();
}

async function loadI18n() {
  const url = lang === "uk" ? PATHS.i18nUk : PATHS.i18nEn;
  t = await fetch(url).then(r => r.json());
}

async function refreshLiveData() {
  activities = await loadLiveActivities();
  filteredActivities = activities;
  applyFilters();
}

async function switchLanguage(newLang) {
  if (lang === newLang) {
    updateLanguageButtons();
    return;
  }

  lang = newLang;
  localStorage.setItem("lang", lang);

  await loadI18n();

  translateStaticUI();
  populateControls();
  updateActivityTypeOptions();
  applyFilters();
}

async function init() {
  await loadI18n();

  const [settlements, groups, metrics] = await Promise.all([
    fetch(PATHS.settlements).then(r => r.json()),
    fetch(PATHS.activityGroups).then(r => r.json()),
    fetch(PATHS.metrics).then(r => r.json())
  ]);

  settlementsGeo = settlements;
  activityConfig = groups;
  metricsConfig = metrics;

  activities = await loadLiveActivities();
  filteredActivities = activities;

  translateStaticUI();
  populateControls();
  applyFilters();
}

async function exportMapToPng() {
  const button = document.getElementById("export-png-btn");
  button.disabled = true;
  button.textContent = "…";

  try {
    const canvas = await html2canvas(document.getElementById("map"), {
      useCORS: true,
      allowTaint: false,
      backgroundColor: null,
      logging: false
    });

    const link = document.createElement("a");
    const timestamp = new Date().toISOString().replace(/[:.]/g, "-");

    link.download = `unicef-activity-heatmap-${timestamp}.png`;
    link.href = canvas.toDataURL("image/png");
    link.click();
  } catch (error) {
    console.error(error);
    alert(
      lang === "uk"
        ? "Не вдалося створити PNG. Спробуй ще раз або перевір консоль."
        : "Failed to export PNG. Try again or check console."
    );
  } finally {
    button.disabled = false;
    button.textContent = "📷";
  }
}

setTimeout(() => {
  document.getElementById("activity-group-filter").addEventListener("change", () => {
    updateActivityTypeOptions();
    applyFilters();
  });

  document.getElementById("activity-type-filter").addEventListener("change", applyFilters);
  document.getElementById("assistance-type-filter").addEventListener("change", applyFilters);
  document.getElementById("metric-filter").addEventListener("change", applyFilters);
  document.getElementById("date-from-filter").addEventListener("change", applyFilters);
  document.getElementById("date-to-filter").addEventListener("change", applyFilters);

  document.getElementById("apply-filters").addEventListener("click", applyFilters);

  document.getElementById("toggle-filters-btn").addEventListener("click", () => {
    document.querySelector(".control-box").classList.toggle("hidden-panel");
  });

  document.getElementById("export-png-btn").addEventListener("click", exportMapToPng);

  document.getElementById("refresh-data").addEventListener("click", async () => {
    await refreshLiveData();
  });

  document.getElementById("reset-filters").addEventListener("click", () => {
    document.getElementById("date-from-filter").value = "";
    document.getElementById("date-to-filter").value = "";

    document.getElementById("activity-group-filter").value = "";
    updateActivityTypeOptions();
    document.getElementById("activity-type-filter").value = "";
    document.getElementById("assistance-type-filter").value = "";
    document.getElementById("metric-filter").value = metricsConfig.default_metric;

    applyFilters();
  });

  updateLanguageButtons();
}, 0);

init().catch(error => {
  console.error(error);
  document.getElementById("summary-box").innerHTML =
    `<b>Initialization error</b><br>${error.message}`;
});
</script>
