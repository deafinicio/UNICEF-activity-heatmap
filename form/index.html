<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />

<!-- Primary Meta Tags -->
<meta name="title" content="UNICEF Activity Form — Kharkiv Oblast">
<meta name="description" content="Data entry form for UNICEF-supported humanitarian activities in Kharkiv Oblast.">

<!-- Open Graph / Telegram / WhatsApp / Facebook / LinkedIn -->
<meta property="og:type" content="website">
<meta property="og:url" content="https://deafinicio.github.io/unicef-activity-heatmap/form/">
<meta property="og:site_name" content="UNICEF Activity Heatmap">
<meta property="og:title" content="UNICEF Activity Form — Kharkiv Oblast">
<meta property="og:description" content="Form for entering UNICEF-supported humanitarian activity data in Kharkiv Oblast.">
<meta property="og:image" content="https://deafinicio.github.io/unicef-activity-heatmap/assets/preview-form.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:type" content="image/png">

<!-- Twitter / X -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:url" content="https://deafinicio.github.io/unicef-activity-heatmap/form/">
<meta name="twitter:title" content="UNICEF Activity Form — Kharkiv Oblast">
<meta name="twitter:description" content="Form for entering UNICEF-supported humanitarian activity data in Kharkiv Oblast.">
<meta name="twitter:image" content="https://deafinicio.github.io/unicef-activity-heatmap/assets/preview-form.png">

<!-- Theme -->
<meta name="theme-color" content="#2563eb">
<link rel="stylesheet" href="styles.css" />
</head>

<body>
<main class="page">
  <section class="card">
    <div class="topbar">
      <div>
        <h1 id="page-title">UNICEF Activity Form</h1>
        <p id="page-subtitle">Activity data entry form</p>
      </div>

      <div class="language-switch">
        <button type="button" id="lang-uk">UA</button>
        <button type="button" id="lang-en">EN</button>
      </div>
    </div>

    <form id="activity-form" autocomplete="off">
      <div class="form-section">
        <label id="activity-group-label" for="activity_group">Activity group</label>
        <select id="activity_group" name="activity_group" required></select>
      </div>

      <div id="common-fields"></div>

      <div id="group-fields"></div>

      <details id="demographics-section" class="details-block" open>
        <summary id="demographics-title">Demographics</summary>
        <div id="demographics-fields"></div>
      </details>

      <div class="summary-box">
        <h2 id="summary-title">Calculated totals</h2>
        <div id="calculated-summary"></div>
      </div>

      <div class="actions">
        <button type="submit" id="submit-btn">Submit</button>
        <button type="button" id="reset-btn" class="secondary">Reset</button>
      </div>

      <div id="status-message" class="status"></div>
    </form>
  </section>

  <div id="success-modal" class="modal hidden">
    <div class="modal-content">
      <h2 id="success-modal-title">Дані успішно надіслані</h2>
      <p id="success-modal-text">Запис додано до таблиці.</p>
      <button type="button" id="success-modal-ok">OK</button>
    </div>
  </div>
</main>

<script src="app.js"></script>
</body>
</html>
